  /api/v1/enrollments:
    get:
      tags:
        - Enrollments
      summary: Get all enrollments
      responses:
        "200":
          description: Enrollment list

    post:
      tags:
        - Enrollments
      summary: Create enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Enrollment created
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/enrollments/{id}:
    get:
      tags:
        - Enrollments
      summary: Get enrollment by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Enrollment found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Enrollments
      summary: Update enrollment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "200":
          description: Enrollment updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Enrollments
      summary: Delete enrollment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Enrollment deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/grades:
    get:
      tags:
        - Grades
      summary: Get all grades
      responses:
        "200":
          description: Grade list

    post:
      tags:
        - Grades
      summary: Create grade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "201":
          description: Grade created
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/grades/{id}:
    get:
      tags:
        - Grades
      summary: Get grade by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Grade found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Grades
      summary: Update grade
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "200":
