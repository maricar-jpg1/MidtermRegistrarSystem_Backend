    delete:
      tags:
        - Schedules
      summary: Delete schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Schedule deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:

  parameters:

    Id:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Required field is missing.

    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        student_id:
          type: string
          example: "2026-0001"
        first_name:
          type: string
          example: Aiko
        last_name:
          type: string
          example: Fujimoto
        email:
          type: string
          example: aiko@example.com
        program:
          type: string
          example: BSCS
        year_level:
          type: integer
          example: 2
        status:
          type: string
          example: Active

    StudentInput:
      type: object
      required:
        - student_id
        - first_name
        - last_name
        - program
      properties:
        student_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        program:
          type: string
        year_level:
          type: integer
        status:
          type: string

    FacultyInput:
      type: object
      required:
        - faculty_id
        - first_name
        - last_name
        - department
      properties:
        faculty_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        position:
          type: string
        specialization:
          type: string
        status:
          type: string

    SubjectInput:
      type: object
      required:
        - code
        - title
        - units
        - program
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        units:
          type: integer
        program:
          type: string
        year_level:
          type: integer
        semester:
          type: string
        prerequisite:
          type: string
        status:
          type: string

    EnrollmentInput:
      type: object
      required:
        - enrollment_id
        - student_id
        - academic_year
        - semester
        - program
        - year_level
        - section
      properties:
        enrollment_id:
          type: string
        student_id:
          type: integer
        academic_year:
          type: string
        semester:
          type: string
        program:
          type: string
        year_level:
          type: integer
        section:
          type: string
        total_units:
          type: integer
        status:
          type: string

    GradeInput:
      type: object
      required:
        - student_id
        - subject_id
        - faculty_id
        - prelim
        - midterm
        - final
      properties:
        student_id:
          type: integer
        subject_id:
          type: integer
        faculty_id:
          type: integer
        semester:
          type: string
        academic_year:
          type: string
        prelim:
          type: number
        midterm:
          type: number
        final:
          type: number

    ScheduleInput:
      type: object
      required:
        - subject_id
        - faculty_id
        - section
        - room
        - day
        - start_time
        - end_time
      properties:
        subject_id:
          type: integer
        faculty_id:
          type: integer
        section:
          type: string
        room:
          type: string
        day:
          type: string
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "10:00"
        semester:
          type: string
        academic_year:
          type: string