          description: Schedule found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Schedules
      summary: Update schedule
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
