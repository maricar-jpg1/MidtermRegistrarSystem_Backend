openapi: 3.0.3

info:
  title: Registrar Management System API
  version: 1.0.0
  description: |
    Mock API for the Registrar Management System.
    This API uses in-memory mock data and does not require a database.

servers:
  - url: http://localhost:5000

tags:
  - name: Health
  - name: Students
  - name: Faculty
  - name: Subjects
  - name: Enrollments
  - name: Grades
  - name: Schedules

paths:

  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is working
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/students:
    get:
      tags:
        - Students
      summary: Get all students
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Student"

    post:
      tags:
        - Students
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
            example:
              student_id: "2026-0004"
              first_name: "Yuto"
              last_name: "Tanaka"
              email: "yuto@example.com"
              program: "BSCS"
              year_level: 1
              status: "Active"
      responses:
        "201":
          description: Student created
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/students/{id}:
    get:
      tags:
        - Students
      summary: Get student by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Student found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Students
      summary: Update student
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "200":
          description: Student updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Students
      summary: Delete student
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Student deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/faculty:
    get:
      tags:
        - Faculty
      summary: Get all faculty
      responses:
        "200":
          description: Faculty list

    post:
      tags:
        - Faculty
      summary: Create faculty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyInput"
      responses:
        "201":
          description: Faculty created
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/faculty/{id}:
    get:
      tags:
        - Faculty
      summary: Get faculty by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Faculty found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Faculty
      summary: Update faculty
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyInput"
      responses:
        "200":
          description: Faculty updated
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Faculty
      summary: Delete faculty
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Faculty deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/subjects:
    get:
      tags:
        - Subjects
      summary: Get all subjects
      responses:
        "200":
          description: Subject list

    post:
      tags:
        - Subjects
      summary: Create subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Subject created
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/subjects/{id}:
    get:
      tags:
        - Subjects
      summary: Get subject by ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subject found
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Subjects
      summary: Update subject
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
